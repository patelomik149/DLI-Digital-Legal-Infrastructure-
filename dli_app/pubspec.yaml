name: dli_app
description: "DLI - Digital Legal Infrastructure. Flutter app for Web and Mobile (loader, register, login, OTP verification by mobile and email, dashboard)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.2
  http: ^1.5.0
  pdfx: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/kyc_flow/images/
    - assets/kyc_flow/terms-and-conditions.pdf
